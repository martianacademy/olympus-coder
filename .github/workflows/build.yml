# Builds Olympus Coder installers on all three platforms.
# Each platform must build on its own runner: the Claude and Codex CLIs and node-pty are native binaries
# that npm installs per platform.
name: Build installers

on:
  workflow_dispatch:
  # Re-enable tag auto-builds once GitHub Actions billing lock is cleared:
  # push:
  #   tags: ['v*']

# Least privilege: the build jobs (which run third-party npm install scripts) can only read the repo;
# only the release job below can write (to publish the GitHub Release).
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple silicon (arm64)
            script: dist:mac
          - os: macos-15-intel    # Intel (x64)
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Linux build tools for node-pty and .deb packaging
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 libsecret-1-dev rpm fakeroot

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build installers
        run: npm run ${{ matrix.script }}
        env:
          # No code signing yet: macOS shows "unidentified developer", Windows shows SmartScreen.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Package headless pure-Node server (Linux & macOS)
        if: runner.os != 'Windows'
        run: npm run package:server

      - uses: actions/upload-artifact@v4
        with:
          name: olympus-coder-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/olympus-server-*.tar.gz
          if-no-files-found: error

  # A pushed `v*` tag publishes the installers from every platform as one GitHub Release, for direct download.
  release:
    needs: build
    permissions:
      contents: write
    # Runs even if one platform failed, so the installers that did build are still published.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Olympus Coder ${{ github.ref_name }}
          generate_release_notes: true
          files: installers/*
