# Builds Olympus Coder installers on all three platforms.
# Each platform must build on its own runner: the Claude and Codex CLIs and node-pty are native binaries
# that npm installs per platform.
name: Build installers

on:
  workflow_dispatch:
  # Re-enable tag auto-builds once GitHub Actions billing lock is cleared:
  # push:
  #   tags: ['v*']

# Least privilege: the build jobs (which run third-party npm install scripts) can only read the repo;
# only the release job below can write (to publish the GitHub Release).
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple silicon (arm64)
            script: dist:mac
          - os: macos-15-intel    # Intel (x64)
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Linux build tools for node-pty and .deb packaging
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 libsecret-1-dev rpm fakeroot

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build installers
        run: npm run ${{ matrix.script }}
        env:
          # No code signing yet: macOS shows "unidentified developer", Windows shows SmartScreen.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Package headless pure-Node server (Linux & macOS)
        if: runner.os != 'Windows'
        run: npm run package:server

      - uses: actions/upload-artifact@v4
        with:
          name: olympus-coder-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/olympus-server-*.tar.gz
          if-no-files-found: error

      # Microsoft Store package (MSIX/.appx), packed from the win-unpacked folder the NSIS build just made. It is
      # unsigned: the Store signs it on submission. Built after the NSIS upload so a Store-only problem (for example
      # the Partner Center identity placeholders in package.json `build.appx`) never blocks the .exe installer.
      - name: Build Microsoft Store package (.appx)
        if: runner.os == 'Windows'
        run: npm run dist:win:store
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Its own artifact, never part of the public GitHub Release (the release job downloads only olympus-coder-*).
      # Test it with the windows-msix job in smoke.yml; upload it to Partner Center by hand.
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: store-msix-windows
          path: dist/*.appx
          if-no-files-found: error

  # A pushed `v*` tag publishes the installers from every platform as one GitHub Release, for direct download.
  release:
    needs: build
    permissions:
      contents: write
    # Runs even if one platform failed, so the installers that did build are still published.
    # Only for a pushed tag: a manual run (even on a tag) must never overwrite release assets uploaded by hand.
    if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      # Only the installer artifacts: the unsigned Store package (store-msix-windows) must never be published here.
      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: olympus-coder-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Olympus Coder ${{ github.ref_name }}
          generate_release_notes: true
          files: installers/*
